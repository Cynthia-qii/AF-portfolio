<!doctype html>
<html lang="zh-CN">
<head>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#eee7dc;--ink:#33251c;--muted:#806d5b;--accent:#a56e47;--white:#f8f6f1;--line:#d5c9b9;--shadow:rgba(46,29,17,.23)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Noto Serif SC",serif;color:var(--ink)}
    button{font:inherit}
    .cover{height:100svh;min-height:560px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#f1dfd2 0%,#e8cfc2 52%,#d8b4a8 100%);isolation:isolate;color:#704d46}
    .cover::before{content:"";position:absolute;inset:20px;border:1px solid rgba(139,92,83,.28);pointer-events:none}
    .cover::after{content:"";position:absolute;inset:27px;background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(127,82,74,.025) 40px),radial-gradient(rgba(122,80,72,.12) .5px,transparent .7px);background-size:auto,4px 4px;opacity:.3;pointer-events:none}
    .cover-lockup{position:absolute;z-index:3;left:50%;top:46%;transform:translate(-50%,-50%);width:min(84vw,1095px);display:flex;flex-direction:column;align-items:center}
    .cover-lockup::before{content:"";position:absolute;z-index:-1;left:-2.3%;right:-2.3%;top:-2px;bottom:33px;border:1px solid rgba(248,224,210,.5);border-radius:13px;background:linear-gradient(112deg,#956b65 0%,#a87972 48%,#8d625c 100%);box-shadow:0 20px 45px rgba(111,70,62,.2),inset 0 1px 0 rgba(255,244,235,.24)}
    .cover-hotspot{position:relative;width:100%;height:auto;border:0;background:transparent;cursor:pointer;transition:scale .32s cubic-bezier(.2,.75,.2,1);padding:0}
    .cover-hotspot img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 12px rgba(42,22,9,.22))}
    .cover-hotspot:hover{scale:1.035}
    .cover-hotspot:focus-visible{outline:1px solid rgba(255,246,230,.8);outline-offset:10px}
    .cover-name{margin-top:-4px;color:#fff0e3;font-size:clamp(15px,1.8vw,21px);letter-spacing:.18em;text-indent:.18em;text-shadow:0 3px 14px rgba(42,22,9,.28)}
    .cover-hint{position:absolute;z-index:3;left:50%;bottom:5.6%;transform:translateX(-50%);color:#704d46;font:10px "DM Mono",monospace;letter-spacing:.28em;text-transform:uppercase;opacity:.76;white-space:nowrap}
    .paper-slip{position:absolute;z-index:1;background:#f4e7d9;color:#68483e;border:1px solid rgba(143,99,87,.24);box-shadow:0 12px 28px rgba(97,61,52,.15);font:9px/1.7 "DM Mono",monospace;letter-spacing:.08em;padding:17px 19px;width:174px;opacity:.96}
    .paper-slip strong{display:block;font:600 12px "Playfair Display",serif;letter-spacing:.14em;margin-bottom:9px;color:#533930}
    .paper-slip .rule{height:1px;background:rgba(104,72,62,.27);margin:7px 0}
    .paper-slip .amount{display:flex;justify-content:space-between}
    .slip-left{left:8%;top:12%;transform:rotate(-8deg)}
    .slip-right{right:8%;top:14%;transform:rotate(6deg);width:192px}
    .cover-art{position:absolute;z-index:2;bottom:12%;display:grid;place-items:center;color:#8c6157;transition:transform .35s cubic-bezier(.2,.75,.2,1),filter .35s;filter:drop-shadow(0 9px 8px rgba(109,71,61,.12))}
    .cover-art:hover{transform:translateY(-6px) rotate(-3deg) scale(1.06);filter:drop-shadow(0 15px 12px rgba(109,71,61,.2))}
    .coffee-art{left:18%;width:114px;height:108px}
    .coffee-art svg{width:100%;height:100%;overflow:visible}
    .steam-line{fill:none;stroke:#a27468;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:30;stroke-dashoffset:0;transition:stroke-dashoffset .55s ease}
    .coffee-art:hover .steam-line{stroke-dashoffset:30}
    .coin-art{right:18%;width:124px;height:100px}
    .coin-art svg{width:100%;height:100%;overflow:visible}
    .coin-art:hover svg{animation:coin-tilt .6s ease-in-out}
    @keyframes coin-tilt{50%{transform:rotateY(28deg) rotate(-5deg)}}
    .workbench{min-height:100svh;background:var(--paper);display:none;position:relative;overflow:hidden;padding:42px 5vw 36px;isolation:isolate}
    .workbench.active{display:flex;flex-direction:column}
    .workbench::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(92,66,43,.16) .55px,transparent .7px);background-size:5px 5px;opacity:.14;pointer-events:none;z-index:-1}
    .topbar{display:flex;justify-content:space-between;align-items:center;font:11px "DM Mono",monospace;letter-spacing:.12em;color:#796754;text-transform:uppercase}
    .topbar button{border:0;background:none;color:inherit;cursor:pointer;padding:10px 0;letter-spacing:inherit;font:inherit}
    .topbar button:hover{color:var(--accent)}
    .scene{flex:1;display:grid;place-items:center;perspective:1400px;min-height:460px;padding:20px 0 10px}
    .calculator{position:relative;width:min(900px,94vw);padding:28px 31px 31px;border-radius:30px;background:linear-gradient(145deg,#cba4a0 0%,#b98984 42%,#a16f69 100%);border:1px solid rgba(250,225,214,.82);box-shadow:inset 2px 2px 3px rgba(255,246,238,.72),inset -5px -6px 14px rgba(101,56,53,.19),18px 26px 28px rgba(65,38,33,.22),0 46px 52px rgba(74,51,31,.13);transform:rotateZ(-1.2deg) translateY(-8px);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s;transform-style:preserve-3d}
    .calculator::before{content:"";position:absolute;inset:12px -12px -12px 12px;border-radius:30px;background:linear-gradient(140deg,#a87670,#805751);transform:translateZ(-22px);z-index:-1;box-shadow:8px 15px 22px rgba(61,39,22,.2)}
    .calculator::after{content:"";position:absolute;z-index:0;inset:9px;border-radius:23px;pointer-events:none;opacity:.16;background:radial-gradient(circle at center,rgba(255,238,226,.7) 0 1px,transparent 1.4px);background-size:13px 13px;mask-image:linear-gradient(90deg,#000,transparent 36%,transparent 64%,#000)}
    .calculator:hover{transform:rotateZ(-1.2deg) translateY(-8px) scale(1.018);box-shadow:inset 2px 2px 3px rgba(255,246,238,.72),inset -5px -6px 14px rgba(101,56,53,.19),22px 30px 34px rgba(46,29,17,.25),0 50px 56px rgba(74,51,31,.15)}
    .solar{height:12px;display:flex;justify-content:flex-end;gap:3px;margin:0 3px 11px}
    .solar i{display:block;width:34px;border:1px solid rgba(255,238,222,.3);border-radius:2px;background:repeating-linear-gradient(90deg,#5a3c3a 0 10px,#76524d 10px 11px);box-shadow:inset 0 1px 2px rgba(255,255,255,.16)}
    .display{height:94px;border-radius:14px;background:linear-gradient(150deg,#eedbd5,#dfc4bd);border:1px solid #caa59c;box-shadow:inset 3px 4px 9px rgba(85,52,48,.13),inset -1px -1px 0 #f8ede8;padding:13px 18px;margin-bottom:17px;display:flex;flex-direction:column;justify-content:space-between;color:#59423d}
    .display-label{font:9px "DM Mono",monospace;letter-spacing:.18em;opacity:.72}
    .display-value{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:500 clamp(21px,4vw,29px) "DM Mono",monospace;letter-spacing:.03em}
    .display-value small{font:9px "DM Mono",monospace;letter-spacing:.08em;opacity:.64}
    .keypad-layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:14px;align-items:stretch;position:relative;z-index:1}
    .keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(64px,1fr));gap:10px}
    .key{position:relative;z-index:1;min-height:68px;border:1px solid #e8e0d4;border-radius:12px;color:#4d392a;background:linear-gradient(155deg,#fffefa,#eee8dd);box-shadow:3px 4px 0 #d7cbbb,4px 6px 9px rgba(68,48,29,.10),inset 1px 1px 1px #fff;cursor:pointer;pointer-events:auto;touch-action:manipulation;transition:transform .14s ease,box-shadow .14s,background .14s,filter .14s;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
    .key:hover,.key:focus-visible{transform:translateY(-2px) scale(1.02);box-shadow:3px 7px 0 #cdb99f,5px 9px 13px rgba(68,48,29,.2),inset 1px 1px 1px #fff;background:linear-gradient(155deg,#fff,#f1e7d8);filter:brightness(1.025);z-index:3}
    .key:active{transform:translateY(2px);box-shadow:1px 2px 0 #d7cbbb,2px 3px 4px rgba(68,48,29,.1)}
    .key .symbol{font:500 9px "DM Mono",monospace;letter-spacing:.11em;color:#9d7351}
    .key .label{font-size:12px;font-weight:600;white-space:nowrap}
    .key.feature{background:linear-gradient(150deg,#a86f64,#89554e);border-color:#d4a29a;color:#fff7f0;box-shadow:3px 4px 0 #754b45,4px 6px 9px rgba(68,48,29,.18),inset 1px 1px 1px rgba(255,255,255,.35)}
    .key.feature .symbol{color:#f0d2c8}
    .key.feature:hover{background:linear-gradient(150deg,#b57d72,#955f57)}
    .calculator-pad{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:8px;min-width:0}
    .numeric-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(46px,1fr));gap:7px;min-width:0}
    .number-key,.operator-key{min-width:0;min-height:42px;border:1px solid #eadbd3;border-radius:10px;color:#614843;background:linear-gradient(150deg,#fffaf5,#efe3db);box-shadow:2px 3px 0 #c9afa5,3px 5px 8px rgba(68,48,29,.1),inset 1px 1px 1px #fff;cursor:pointer;transition:transform .14s,box-shadow .14s,background .14s;}
    .number-key{font:500 17px "DM Mono",monospace}
    .operator-keys{display:grid;grid-template-rows:repeat(6,minmax(38px,1fr));gap:6px}
    .operator-key{font:500 17px "DM Mono",monospace;background:linear-gradient(150deg,#e3c6bd,#c99a90);border-color:#d7aaa0;color:#593e39}
    .operator-key.clear{font-size:11px;letter-spacing:.08em;background:linear-gradient(150deg,#a86f64,#89554e);color:#fff7f0;border-color:#d4a29a}
    .number-key:hover,.operator-key:hover,.number-key:focus-visible,.operator-key:focus-visible{transform:translateY(-2px);box-shadow:3px 6px 0 #bfa399,5px 8px 12px rgba(68,48,29,.19);background:linear-gradient(150deg,#fffdf9,#f1e4dc);z-index:2}
    .operator-key:hover,.operator-key:focus-visible{background:linear-gradient(150deg,#eccfc5,#d6a89e)}
    .operator-key.clear:hover,.operator-key.clear:focus-visible{background:linear-gradient(150deg,#b57d72,#955f57)}
    .number-key:active,.operator-key:active{transform:translateY(1px);box-shadow:1px 2px 0 #c9afa5}
    .bench-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;font:10px "DM Mono",monospace;color:#897864;letter-spacing:.1em;text-transform:uppercase}
    .bench-foot span:last-child{color:#a88059}
    .detail{position:fixed;z-index:8;inset:0;background:rgba(39,29,21,.38);display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s;backdrop-filter:blur(5px)}
    .detail.open{opacity:1;visibility:visible}
    .sheet{width:min(580px,100%);max-height:min(82svh,760px);overflow:auto;background:#f7f2ea;border:1px solid rgba(255,255,255,.8);box-shadow:0 24px 70px rgba(34,23,15,.25);padding:30px 34px 34px;position:relative;transform:translateY(12px);transition:transform .26s}
    .detail.open .sheet{transform:translateY(0)}
    .sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:21px}
    .sheet-kicker{font:10px "DM Mono",monospace;color:#9b7556;letter-spacing:.18em;text-transform:uppercase;margin-bottom:7px}
    .sheet h2{font-size:25px;line-height:1.3;margin:0;font-weight:600}
    .close{border:0;background:transparent;color:#715d4c;font-size:22px;cursor:pointer;padding:0 3px;line-height:1}
    .sheet-content{font-size:14px;line-height:1.9;color:#574739}
    .sheet-content p{margin:0 0 14px}
    .sheet-content p:last-child{margin-bottom:0}
    .sheet-content strong{color:#33251c;font-weight:600}
    .sheet-content ul{padding-left:18px;margin:10px 0}
    .sheet-content li{padding-left:3px;margin:5px 0}
    .pill-row{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
    .pill{border:1px solid #d8c9b7;padding:4px 9px;font:10px "DM Mono",monospace;color:#775f49;border-radius:2px}
    .contact-link{color:#98683f;text-decoration:none;border-bottom:1px solid #cdb193}
    @media(max-width:600px){.cover{min-height:520px}.cover::before{inset:12px}.cover-lockup{top:43%;width:89vw}.cover-lockup::before{left:-2%;right:-2%;bottom:26px}.cover-name{font-size:15px}.paper-slip{width:122px;padding:11px 12px;font-size:7px}.paper-slip strong{font-size:10px}.slip-left{left:5%;top:7%;transform:rotate(-8deg)}.slip-right{right:5%;top:8%;transform:rotate(6deg);width:132px}.coffee-art{left:10%;bottom:12%;width:82px;height:78px}.coin-art{right:10%;bottom:12%;width:91px;height:75px}.cover-hint{bottom:3.5%}.workbench{padding:24px 18px 22px}.scene{min-height:490px}.calculator{padding:23px 19px 25px;border-radius:23px;width:min(900px,94vw)}.calculator::before{border-radius:24px}.calculator::after{inset:7px}.display{height:90px}.keypad-layout{grid-template-columns:1fr;gap:12px}.keys{grid-template-rows:repeat(3,minmax(58px,1fr));gap:9px}.calculator-pad{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.numeric-keys{grid-template-rows:repeat(4,minmax(42px,1fr));gap:7px}.operator-keys{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,42px);gap:7px}.key{min-height:58px}.key .label{font-size:11px}.sheet{padding:24px 22px 26px}.sheet h2{font-size:22px}.sheet-content{font-size:13px}.bench-foot{font-size:8px;letter-spacing:.06em}}
    @media(max-width:380px){.calculator{padding:18px 14px 21px}.keys{gap:7px}.key{min-height:56px}.key .label{font-size:10px}.key .symbol{font-size:8px}.numeric-keys,.operator-keys{gap:5px}.number-key,.operator-key{min-height:40px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>

      {key:'01',label:'个人信息',title:'肖筠怡',meta:'ABOUT / PROFILE',body:`<p>东北财经大学财务管理专业本科在读，意向方向为<strong>咨询 / 财务</strong>。</p><div class="pill-row"><span class="pill">GPA 3.85</span><span class="pill">IELTS 7.0</span><span class="pill">CET-6 585</span><span class="pill">ACCA 4/13</span></div><p>电话：18701172187<br>邮箱：<a class="contact-link" href="mailto:904799935@qq.com">904799935@qq.com</a><br>GitHub：<a class="contact-link" href="https://github.com/Cynthia-qii" target="_blank" rel="noreferrer">Cynthia-qii ↗</a></p>`},
      {key:'02',label:'教育背景',title:'教育背景',meta:'EDUCATION / 02',body:`<p><strong>东北财经大学 · 财务管理专业</strong><br>2023.09 — 2027.06 · 本科在读</p><p>GPA 3.85。微观经济学 92、商业经济学 94、财务会计 93、管理会计 94、Excel 金融数学 94。</p><p>已通过 ACCA FA / MA / LW / TX 四门。</p>`},
      {key:'03',label:'实习经历',title:'实习经历',meta:'INTERNSHIP / 03',body:`<p><strong>天健会计师事务所 · 咨询部</strong><br>咨询部实习生 · 2026.07.06 — 2026.08.21</p><p><strong>港股 IPO · ESG</strong><br>研读联交所 ESG 指引，梳理 5 家港股同业招股书及客户资料；协同推进 5 场跨部门 ESG 咨询访谈，结合 AI 智能纪要输出 6 份访谈摘要。提出 3 条优化建议并获项目组采纳，完成港股招股书 ESG 章节中英双语文稿。</p><p><strong>内控梳理</strong><br>提炼学校历史内控手册及官方制度，识别申报、审批、监督等关键控制点 100+ 个；编制 6 大业务流程、400+ 条风险控制矩阵。</p><p><strong>流程优化</strong><br>使用 Draw.io 与 Claude AI 设计流程图底稿，独立绘制 100+ 张可视化流程图，将复杂制度转化为直观路径。</p><hr><p><strong>天职国际会计师事务所 · 税务部</strong><br>税务部实习生 · 2025.07.14 — 2025.08.14</p><ul><li>核查 100+ 项客户项目成本，覆盖申报、中期、结项全阶段；使用 Excel VLOOKUP、SUMIF 归集成本。</li><li>结合 AI 比对成本数据，识别 70+ 项费用超支、结余问题，形成 50+ 份调整意见并推动修正。</li><li>使用 VLOOKUP、FILTER 定位 200+ 项报废资产，更新台账；输出 10+ 篇清查报告，支持资产盘点与账实核对。</li></ul>`},
      {key:'04',label:'项目经历',title:'项目经历',meta:'PROJECTS / 04',body:`<p><strong>2025年CGMA商业精英国际挑战赛</strong><br>2025.11 — 2025.12 · 省级三等奖 · 核心成员</p><p>围绕公司客户转型案例，分析销售团队授权风险、JIT采购财务比率影响及股权投资会计处理，为管理层提供财务决策建议。</p><p><strong>风险评估</strong><br>负责销售团队风险评估与治理方案设计，识别过度授权可能引发的 4 类风险，并结合案例提出 6 条管控措施。</p><p><strong>机制设计</strong><br>设计 4 人跨职能团队，制定价格底线与分级审批机制，明确授权边界和决策流程，降低销售谈判风险。</p><hr><p><strong>2026年大学生创新创业训练计划项目</strong><br>2026.04 — 2026.09 · 国家级立项 · 项目负责人</p><p>以江永女书为核心，构建“上游创收—下游增收—收益反哺”体系，推动文化传承与女性发展双向赋能。</p><p><strong>项目统筹</strong><br>主导任务拆解、进度管控与多方沟通，对接 2 家外部企业引入赞助资金，推进实地调研与站点落地。</p><p><strong>资金管理</strong><br>搭建“文创开发—课程营收—收益反哺”资金闭环，统筹项目全流程预算编制与收支核算。</p><p><strong>业务落地</strong><br>开发线上女书书法课程，设计 AI Agent“妤妤”作为虚拟讲师辅助教学，累计售出 40+ 课时，推动文化内容转化为实际营收。</p><p><strong>成果评估</strong><br>联合高校引入多模态评估技术，完成下游 50+ 人次农村妇女多模态信息采集，为项目效果评估与后续优化提供数据支持。</p>`},
      {key:'05',label:'科研经历',title:'《“00后”大学生就业心理焦虑问题破解对策研究》',meta:'RESEARCH / 05',body:`<p><strong>第二作者</strong> · 2025.03 — 2026.02</p><ul><li>梳理 10+ 篇就业现状与焦虑问题文献；借助 AI 完成初筛与要点提炼。</li><li>设计 26 题问卷并收集 289 份有效样本；访谈 10+ 所高校、50+ 人次，归纳就业焦虑诱因。</li><li>基于 AHP 与 SPSS 测算诱因权重，构建“指导—服务—支持”三方干预框架。</li></ul><p>成果发表于省级期刊《大视野》。</p>`},
      {key:'06',label:'学生工作',title:'《东财大学生》编辑部 · 文字编辑部部长',meta:'LEADERSHIP / 06',body:`<p><strong>2023.09 — 2026.09</strong></p><p>《东财大学生》曾获评“全国十佳社团”，是东北财经大学历史悠久的思想政治类社团之一。</p><ul><li>统筹团建、发刊活动预算与物资，参与统战部座谈并围绕校园文化与学生发展建言。</li><li>独立撰写 4 篇原创稿件，平均阅读量 1000+、转发量 100+；建立审核、排版、复盘机制，指导完成 20+ 篇稿件。</li><li>获评校“优秀学生干部”。</li></ul>`},
      {key:'07',label:'专业技能',title:'专业技能',meta:'TOOLKIT / 07',body:`<p><strong>财务与分析</strong><br>ACCA FA / MA / LW / TX；Excel（VLOOKUP、SUMIF、FILTER、数据透视表）；基础 SQL、Python 数据分析；SPSS、AHP。</p><p><strong>办公与创作</strong><br>全国计算机等级考试二级（WPS Office）；Word、Excel、PowerPoint；Draw.io、可画、秀米、Procreate；公众号运营与视频剪辑。</p><p><strong>AI 工具</strong><br>ChatGPT、Codex、Claude、Coze。</p><div class="pill-row"><span class="pill">IELTS 7.0</span><span class="pill">阅读 8.0</span><span class="pill">CET-6 585</span><span class="pill">CET-4 620</span></div>`},
      {key:'08',label:'荣誉奖项',title:'荣誉与奖项',meta:'RECOGNITION / 08',body:`<ul><li>东北财经大学校综合奖学金（两次）</li><li>科研标兵、优秀学生干部、优秀共青团员</li><li>《东财大学生》优秀编辑二等奖、三等奖</li><li>“三下乡”暑期社会实践校级二等奖</li><li>“创青春”大连市青年创新创业大赛公益创业专项铜奖</li><li>2025 年大学生创新创业训练计划校级立项</li></ul>`},
      {key:'09',label:'特长爱好',title:'课余兴趣',meta:'BEYOND WORK / 09',body:`<div class="pill-row"><span class="pill">古筝十级</span><span class="pill">民族舞六级</span><span class="pill">吉他</span><span class="pill">声乐六级</span><span class="pill">写作</span><span class="pill">绘画</span><span class="pill">阅读</span><span class="pill">羽毛球</span><span class="pill">乒乓球</span></div>`}
    ];
    const keyRoot=document.getElementById('keys');
    const keyCodes=['ID','EDU','EXP','PROJECT','R&D','TEAM','SKILL','AWARD','LIFE'];
    if(modules.length!==keyCodes.length) throw new Error('Module keys and labels are out of sync');
    modules.forEach((m,i)=>{const b=document.createElement('button');b.type='button';b.className='key key-module'+(i===0?' feature':'');b.dataset.module=m.key;b.setAttribute('aria-label',`${m.label}，打开详细内容`);b.innerHTML=`<span class="symbol">${m.key} / ${keyCodes[i]}</span><span class="label">${m.label}</span>`;b.addEventListener('click',()=>openModule(i));keyRoot.appendChild(b)});
    const numericRoot=document.getElementById('numeric-keys');
    ['7','8','9','4','5','6','1','2','3','0','00','.'].forEach(value=>{const b=document.createElement('button');b.type='button';b.className='number-key';b.textContent=value;b.setAttribute('aria-label',value==='.'?'小数点':`${value} 数字键`);b.addEventListener('click',()=>inputNumber(value));numericRoot.appendChild(b)});
    const operatorRoot=document.getElementById('operator-keys');
    [['÷','divide'],['×','multiply'],['−','subtract'],['+','add'],['=','equals'],['AC','clear']].forEach(([label,action])=>{const b=document.createElement('button');b.type='button';b.className='operator-key'+(action==='clear'?' clear':'');b.textContent=label;b.setAttribute('aria-label',({divide:'除法',multiply:'乘法',subtract:'减法',add:'加法',equals:'等于',clear:'归零'})[action]);b.addEventListener('click',()=>operate(action));operatorRoot.appendChild(b)});
    const cover=document.getElementById('cover'),bench=document.getElementById('workbench'),detail=document.getElementById('detail');
    const readout=document.getElementById('readout'),displayMeta=document.getElementById('display-meta'),displayLabel=document.querySelector('.display-label');
    let calcMode=false,storedValue=null,pendingOperator=null,replaceEntry=false;
    function enterCalcMode(){if(!calcMode){readout.textContent='0';calcMode=true}displayLabel.textContent='QUICK CALCULATOR';displayMeta.textContent=pendingOperator?({add:'＋',subtract:'−',multiply:'×',divide:'÷'})[pendingOperator]:'READY'}
    function inputNumber(value){enterCalcMode();if(readout.textContent==='ERROR'||replaceEntry){readout.textContent=value==='.'?'0.':value==='00'?'0':value;replaceEntry=false;displayMeta.textContent='ENTRY';return}if(value==='.'&&readout.textContent.includes('.'))return;if(readout.textContent==='0'&&value!=='.'&&value!=='00')readout.textContent=value;else readout.textContent+=value;displayMeta.textContent='ENTRY'}
    function calculate(a,b,operator){if(operator==='add')return a+b;if(operator==='subtract')return a-b;if(operator==='multiply')return a*b;if(operator==='divide')return b===0?null:a/b;return b}
    function operate(action){if(action==='clear'){calcMode=false;storedValue=null;pendingOperator=null;replaceEntry=false;readout.textContent='肖筠怡';displayLabel.textContent='PROFILE / 2026';displayMeta.textContent='CYNTHIA / FINANCE';return}enterCalcMode();if(action==='equals'){if(pendingOperator&&storedValue!==null){const result=calculate(storedValue,Number(readout.textContent),pendingOperator);readout.textContent=result===null?'ERROR':String(Number(result.toFixed(8)));storedValue=null;pendingOperator=null;displayMeta.textContent=result===null?'DIVIDE BY ZERO':'RESULT';replaceEntry=true}return}if(pendingOperator&&storedValue!==null&&!replaceEntry){const result=calculate(storedValue,Number(readout.textContent),pendingOperator);if(result===null){readout.textContent='ERROR';storedValue=null;pendingOperator=null;replaceEntry=true;return}storedValue=result;readout.textContent=String(Number(result.toFixed(8)))}else{const value=Number(readout.textContent);storedValue=Number.isFinite(value)?value:0}pendingOperator=action;replaceEntry=true;displayMeta.textContent=({add:'＋',subtract:'−',multiply:'×',divide:'÷'})[action]}
    document.getElementById('enter').addEventListener('click',()=>{cover.hidden=true;bench.classList.add('active');window.scrollTo(0,0)});
    document.getElementById('back').addEventListener('click',()=>{bench.classList.remove('active');cover.hidden=false;closeModule();window.scrollTo(0,0)});
    function openModule(i){const m=modules[i];calcMode=false;storedValue=null;pendingOperator=null;replaceEntry=false;displayLabel.textContent='PROFILE / 2026';readout.textContent=m.key+'  '+m.label;displayMeta.textContent=m.meta;document.getElementById('detail-kicker').textContent=m.meta;document.getElementById('detail-title').textContent=m.title;document.getElementById('detail-content').innerHTML=m.body;detail.classList.add('open');document.getElementById('close').focus()}
    function closeModule(){detail.classList.remove('open')}
    document.getElementById('close').addEventListener('click',closeModule);detail.addEventListener('click',e=>{if(e.target===detail)closeModule()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModule()});
  </script>
</body>
</html>
